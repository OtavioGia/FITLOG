<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>FITLOG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FITLOG">
  
  <link rel="icon" type="image/png" href="https://flysantos.com/wp-content/uploads/2026/03/LOGO_FITLOG-2.png">
  <link rel="apple-touch-icon" href="https://flysantos.com/wp-content/uploads/2026/03/LOGO_FITLOG-2.png">
  <link rel="manifest" href="/FITLOG/manifest.json">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body, html {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
    }
    /* O Iframe ocupa toda a tela, dando a cara de App nativo */
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      z-index: 1;
    }
    /* Botão flutuante de instalação */
    #installBtn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #007aff;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 9999; /* Fica por cima do iframe */
      cursor: pointer;
      display: none; /* Escondido por padrão */
    }
  </style>
</head>
<body>

  <!-- Seu App rodando em tela cheia -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbxHhYBvJD3vbHfu8yHQB92mQXYhwYjwVG1JigHfm1D5mGLjpTFKhGegx5NsBxHgIcUU/exec" 
    allowfullscreen
    allow="clipboard-read; clipboard-write">
  </iframe>

  <!-- Botão de Instalar App (Flutuante) -->
  <button id="installBtn">📲 Instalar App FITLOG</button>

  <script>
    // 1. Registra o Service Worker (necessário para virar App)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/FITLOG/sw.js', { scope: '/FITLOG/' })
          .then(function(reg) { console.log('SW registrado com sucesso!'); })
          .catch(function(err) { console.log('Erro no SW:', err); });
      });
    }

    // 2. Lógica para mostrar e acionar o botão de Instalação (Android/Chrome)
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Mostra o botão flutuante se o app ainda não estiver instalado
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt !== null) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('App instalado!');
          installBtn.style.display = 'none'; // Esconde o botão após instalar
        }
        deferredPrompt = null;
      }
    });

    // Se o sistema detectar que o app já foi instalado, garante que o botão suma
    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
