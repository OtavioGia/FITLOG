<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>FITLOG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FITLOG">
  <link rel="icon" type="image/png" href="/FITLOG/icon-512.png">
  <link rel="apple-touch-icon" href="/FITLOG/icon-512.png">
  <link rel="manifest" href="/FITLOG/manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1a1a1a 0%, #000000 70%);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      box-shadow: 0 10px 40px rgba(255, 255, 255, 0.08);
      animation: fadeIn 0.8s ease-out;
    }

    h1 {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0;
      animation: fadeIn 1s ease-out;
    }

    p.subtitle {
      color: #999;
      font-size: 15px;
      margin: -18px 0 0 0;
      animation: fadeIn 1.2s ease-out;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px 24px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      animation: fadeIn 1.4s ease-out;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.97);
      opacity: 0.85;
    }

    .loader {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="/FITLOG/icon-512.png" alt="FITLOG">
    <h1>FITLOG</h1>
    <p class="subtitle">Seu app de treino</p>
    <a href="#" class="btn" id="openBtn">
      <span id="btnText">ABRIR TREINO</span>
      <span class="loader" id="loader"></span>
    </a>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHhYBvJD3vbHfu8yHQB92mQXYhwYjwVG1JigHfm1D5mGLjpTFKhGegx5NsBxHgIcUU/exec";

    document.getElementById('openBtn').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('btnText').style.display = 'none';
      document.getElementById('loader').style.display = 'inline-block';
      window.location.href = SCRIPT_URL;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/FITLOG/sw.js', { scope: '/FITLOG/' })
          .then(function(reg) {
            console.log('Service Worker registrado:', reg.scope);
          })
          .catch(function(err) {
            console.log('Erro ao registrar Service Worker:', err);
          });
      });
    }
  </script>
</body>
</html>
