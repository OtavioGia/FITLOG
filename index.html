<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>FITLOG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FITLOG">
  
  <link rel="icon" type="image/png" href="https://flysantos.com/wp-content/uploads/2026/03/LOGO_FITLOG-2.png">
  <link rel="apple-touch-icon" href="https://flysantos.com/wp-content/uploads/2026/03/LOGO_FITLOG-2.png">
  <link rel="manifest" href="/FITLOG/manifest.json">
  
  <style>
    * { box-sizing: border-box; }
    body, html {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .logo {
      width: 180px;
      height: 180px;
      border-radius: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(255,255,255,0.1);
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 28px;
      letter-spacing: 2px;
    }
    p {
      color: #aaaaaa;
      margin-bottom: 40px;
    }
    .btn {
      background-color: #ff3b30; /* Cor de destaque (pode mudar se quiser) */
      color: white;
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      width: 80%;
      max-width: 300px;
      margin-bottom: 15px;
      transition: transform 0.2s;
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn-install {
      background-color: #007aff; /* Azul para botão de instalar */
      display: none; /* Fica oculto até o navegador permitir a instalação */
    }
    .ios-instruction {
      display: none;
      font-size: 14px;
      color: #888;
      width: 80%;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <img src="https://flysantos.com/wp-content/uploads/2026/03/LOGO_FITLOG-2.png" alt="FITLOG Logo" class="logo">
  <h1>FITLOG</h1>
  <p>Seu app de treino</p>

  <!-- Botão que redireciona para o Google Apps Script -->
  <a href="https://script.google.com/macros/s/AKfycbxHhYBvJD3vbHfu8yHQB92mQXYhwYjwVG1JigHfm1D5mGLjpTFKhGegx5NsBxHgIcUU/exec" class="btn">Entrar no App</a>

  <!-- Botão de Instalação (aparece no Android/Chrome) -->
  <button id="installBtn" class="btn btn-install">Instalar Aplicativo</button>

  <!-- Instrução para iOS -->
  <div id="iosInstruction" class="ios-instruction">
    Para instalar no iPhone, toque em <b>Compartilhar</b> <svg width="15" height="15" viewBox="0 0 50 50" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M25 2L12 15h9v15h8V15h9L25 2zM12 35v8h26v-8h4v12H8V35h4z"/></svg> e depois em <b>"Adicionar à Tela de Início"</b>.
  </div>

  <script>
    // 1. Registro do Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/FITLOG/sw.js', { scope: '/FITLOG/' })
          .then(function(reg) { console.log('SW registrado!', reg.scope); })
          .catch(function(err) { console.log('Erro no SW:', err); });
      });
    }

    // 2. Lógica do Botão de Instalação (PWA)
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    const iosInstruction = document.getElementById('iosInstruction');

    // Detecta se é iOS (iPhone/iPad) para mostrar instrução em texto, pois a Apple não suporta o botão.
    const isIos = () => {
      const userAgent = window.navigator.userAgent.toLowerCase();
      return /iphone|ipad|ipod/.test(userAgent);
    };
    
    const isInStandaloneMode = () => ('standalone' in window.navigator) && (window.navigator.standalone);

    if (isIos() && !isInStandaloneMode()) {
      iosInstruction.style.display = 'block';
    }

    // Captura o evento do Chrome/Android que permite instalação
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); // Impede o prompt automático de aparecer na hora
      deferredPrompt = e; // Guarda o evento
      installBtn.style.display = 'block'; // Mostra o botão "Instalar Aplicativo"
    });

    // Quando o usuário clica no botão "Instalar Aplicativo"
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt !== null) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('Usuário aceitou a instalação');
          installBtn.style.display = 'none'; // Esconde o botão após instalar
        }
        deferredPrompt = null;
      }
    });

    // Esconde o botão se o app já foi instalado com sucesso
    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
